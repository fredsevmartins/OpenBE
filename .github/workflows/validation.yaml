name: Scientific validation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.0'
          use-public-rspm: true
      - name: System requirements
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev libfontconfig1-dev libharfbuzz-dev libfribidi-dev libfreetype6-dev libpng-dev libtiff-dev libjpeg-dev
      - uses: r-lib/actions/setup-renv@v2
      - run: R CMD INSTALL .
      - run: Rscript scripts/run_all_examples.R
      - run: Rscript scripts/run_validation.R
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scientific-results
          path: |
            docs/validation
            examples/**/outputs
