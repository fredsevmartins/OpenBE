name: R CMD check
on:
  push:
    branches: [main, codex/initial-scientific-implementation]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.0'
          use-public-rspm: true
      - name: System requirements
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev libfontconfig1-dev libharfbuzz-dev libfribidi-dev libfreetype6-dev libpng-dev libtiff-dev libjpeg-dev
      - uses: r-lib/actions/setup-renv@v2
      - run: R CMD build .
      - run: R CMD check --no-manual OpenBE_0.1.0.tar.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: R-CMD-check
          path: OpenBE.Rcheck
